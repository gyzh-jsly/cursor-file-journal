<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>日记详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: "Segoe UI", "宋体", SimSun, serif; background: #f4f3ef; color: #2b2b2b; margin: 0; padding: 24px 28px; }
        .diary-detail-header { margin-bottom: 20px; border-bottom: 1px solid #b0a99f; padding-bottom: 12px; }
        .diary-detail-date { font-size: 1.1rem; font-weight: 600; }
        .diary-detail-meta { font-size: 0.85rem; color: #6b5e53; margin-top: 6px; }
        .diary-detail-meta span { margin-right: 18px; }
        .diary-detail-content { font-size: 1rem; line-height: 1.8; white-space: pre-wrap; margin-bottom: 24px; }
        .btn-dossier { background: #fdfdfb; border: 1px solid #b0a99f; color: #2b2b2b; font-size: 0.85rem; padding: 6px 16px; cursor: pointer; }
        .frozen-tag { display: inline-block; background: #e8f0fe; border: 1px solid #4a90e2; color: #1e293b; font-size: 0.8rem; padding: 2px 10px; margin-left: 10px; }
        /* 写段评弹出按钮 */
        .comment-popup-btn {
            position: absolute; display: none; background: #4a6a8a; color: #fff;
            border: none; padding: 4px 12px; font-size: 0.8rem; cursor: pointer;
            border-radius: 4px; z-index: 9999;
        }

        /* 段评列表区域 */
        .comments-section { margin-top: 24px; }
        .comments-section h3 { font-size: 1rem; font-weight: 600; margin-bottom: 12px; color: #2b2b2b; }
        .comment-item { background: #fdfdfb; border: 1px solid #e0dbd1; padding: 10px 14px; margin-bottom: 8px; }
        .comment-item .comment-text { font-size: 0.85rem; color: #6b5e53; margin-bottom: 4px; }
        .comment-item .comment-meta { font-size: 0.75rem; color: #94a3b8; }
        .comment-item .comment-selected { font-size: 0.8rem; color: #4a6a8a; font-style: italic; margin-bottom: 4px; }

        .commented-text {
            background: #fef3c7;
            border-bottom: 2px solid #f59e0b;
            cursor: pointer;
            padding: 0 2px;
        }
        .commented-text:hover {
            background: #fde68a;
        }

        /*用于区分匹配失败的段评高亮颜色*/
        .commented-text[data-match="0"] {
            background: #f0e0d0;  /* 浅橙色，表示偏移失效 */
            border-bottom-color: #f59e0b;
        }
    </style>
</head>
<body th:attr="data-diary-id=${diary.id}">
<div class="diary-detail-header">
    <div class="diary-detail-date">
        📖 日记详情
        <span th:if="${diary.isFrozen == 1}" class="frozen-tag">已冻结</span>
    </div>
    <div class="diary-detail-meta">
        <span>创建于：<span th:text="${createdAtStr}">-</span></span>
        <span th:if="${modifiedAtStr != null}">最后修改：<span th:text="${modifiedAtStr}">-</span></span>
        <span>天气：<span th:text="${diary.firstWeather}">-</span></span>
        <span>修改次数：<span th:text="${diary.modifyCount}">0</span></span>
    </div>
</div>

<div class="diary-detail-content" id="diaryContent" th:text="${diary.content}">日记正文内容...</div>
<!-- 段评列表 -->
<div class="comments-section">
    <h3><i class="bi bi-chat-left-text me-1"></i>段评</h3>
    <div id="commentsList"></div>
</div>

<div class="diary-detail-actions" th:if="${canEdit}">
    <button class="btn-dossier" th:onclick="'editDiary(' + ${diary.id} + ')'">
        <i class="bi bi-pencil me-1"></i>编辑
    </button>
</div>


</body>
</html>
