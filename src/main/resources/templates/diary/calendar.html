<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>写日记 · 年历</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .mini-day.has-diary {
            background: #e8f0fe;
            border: 1px solid #4a90e2;
            color: #2b2b2b;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="year-calendar-container">
    <div class="year-header">
        <button class="btn-primary-diary" onclick="openWriteDiary()"><i class="bi bi-plus-lg me-1"></i>写日记</button>
        <div>
            <select id="yearSelect" class="year-select" onchange="window.changeYearFromSelect()"></select>
<!--            <button class="btn-dossier" onclick="changeYear(-1)"><i class="bi bi-chevron-left"></i></button>-->
<!--            <span id="currentYearLabel" style="font-size: 1.3rem; margin: 0 12px;">2026</span>-->
<!--            <button class="btn-dossier" onclick="changeYear(1)"><i class="bi bi-chevron-right"></i></button>-->
        </div>
    </div>
    <div class="year-grid" id="yearGrid"></div>

    <!-- 月视图（默认隐藏） -->
    <div class="month-view" id="monthView" style="display: none;">
        <div class="month-header">
<!--            <button class="btn-dossier" onclick="backToYear()"><i class="bi bi-arrow-left me-1"></i>返回年历</button>-->
            <button class="btn-dossier btn-circle" onclick="backToYear()"><i class="bi bi-arrow-left"></i></button>
            <span id="monthTitle" style="font-size: 1.2rem; font-weight: 600;"></span>
        </div>
        <div class="month-week-header">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div class="month-grid" id="monthGrid"></div>
    </div>
</div>

</body>
</html>
