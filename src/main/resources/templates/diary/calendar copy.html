<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写日记 · 月历</title>
</head>
<body>
    <div class="calendar-container" th:fragment="calendar-container" style="height: 100%; display: flex; flex-direction: column; padding: 20px;">
        <!-- 顶部：年月切换 + 写日记按钮 -->
        <div class="calendar-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div style="display: flex; align-items: center; gap: 16px;">
                <button id="prevMonthBtn" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-chevron-left"></i>
                </button>
                
                <!-- 年/月选择器 -->
                <div style="display: flex; align-items: center; gap: 8px;">
                    <select id="yearSelect" class="form-select form-select-sm" style="width: auto;">
                        <!-- 动态填充年份 -->
                    </select>
                    <select id="monthSelect" class="form-select form-select-sm" style="width: auto;">
                        <option value="1">1月</option>
                        <option value="2">2月</option>
                        <option value="3">3月</option>
                        <option value="4">4月</option>
                        <option value="5">5月</option>
                        <option value="6">6月</option>
                        <option value="7">7月</option>
                        <option value="8">8月</option>
                        <option value="9">9月</option>
                        <option value="10">10月</option>
                        <option value="11">11月</option>
                        <option value="12">12月</option>
                    </select>
                </div>
                
                <button id="nextMonthBtn" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>
            <button id="writeDiaryBtn" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> 写日记
            </button>
        </div>

        <!-- 星期标题 -->
        <div class="calendar-weekdays" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 8px;">
            <div style="text-align: center; font-weight: 500; color: #6c757d; padding: 8px;">一</div>
            <div style="text-align: center; font-weight: 500; color: #6c757d; padding: 8px;">二</div>
            <div style="text-align: center; font-weight: 500; color: #6c757d; padding: 8px;">三</div>
            <div style="text-align: center; font-weight: 500; color: #6c757d; padding: 8px;">四</div>
            <div style="text-align: center; font-weight: 500; color: #6c757d; padding: 8px;">五</div>
            <div style="text-align: center; font-weight: 500; color: #6c757d; padding: 8px;">六</div>
            <div style="text-align: center; font-weight: 500; color: #6c757d; padding: 8px;">日</div>
        </div>

        <!-- 日期网格 -->
        <div id="calendarGrid" class="calendar-grid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; flex: 1;">
            <!-- 动态渲染 -->
        </div>
    </div>

    <!-- 写日记模态框 -->
    <div class="modal fade" id="writeDiaryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-journal-plus me-2"></i>写日记
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">日记内容</label>
                        <textarea id="diaryContent" class="form-control" rows="6" 
                                  placeholder="今天发生了什么..."></textarea>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="pinDiaryCheck">
                        <label class="form-check-label" for="pinDiaryCheck">
                            <i class="bi bi-pin-angle"></i> 置顶这篇日记
                        </label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="submitDiaryBtn">发布</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 当前显示的年月
        // let currentYear = new Date().getFullYear();
        // let currentMonth = new Date().getMonth() + 1;
        
        // 存储日历数据（有日记的日期和篇数）
        // let calendarData = {};
        // 全局变量
        var currentYear, currentMonth, calendarData;

        // 渲染日历
        function renderCalendar() {
            const year = currentYear;
            const month = currentMonth;
            
            document.getElementById('currentYearMonth').innerText = year + '年' + month + '月';
            
            const firstDay = new Date(year, month - 1, 1);
            const lastDay = new Date(year, month, 0);
            const startDayOfWeek = firstDay.getDay() || 7; // 周一=1, 周日=7
            const totalDays = lastDay.getDate();
            
            let gridHtml = '';
            let currentRow = [];
            
            // 填充上月空白
            for (let i = 1; i < startDayOfWeek; i++) {
                currentRow.push('<div class="calendar-cell empty"></div>');
            }
            
            // 填充本月日期
            for (let d = 1; d <= totalDays; d++) {
                const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const count = calendarData[dateStr] || 0;
                const hasDiary = count > 0;
                
                const cellClass = hasDiary ? 'calendar-cell has-diary' : 'calendar-cell empty-cell';
                const onClick = hasDiary ? `onclick="openDiaryList('${dateStr}')"` : '';
                const cursor = hasDiary ? 'pointer' : 'default';
                
                let cellHtml = `<div class="${cellClass}" style="
                    aspect-ratio: 1;
                    background: ${hasDiary ? '#e8f0fe' : '#ffffff'};
                    border: 1px solid ${hasDiary ? '#4a90e2' : '#e9ecef'};
                    border-radius: 12px;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    cursor: ${cursor};
                    transition: all 0.15s;
                    ${hasDiary ? 'box-shadow: 0 2px 8px rgba(74, 144, 226, 0.15);' : ''}
                " ${onClick}>
                    <span style="font-size: 1.2rem; font-weight: 500; color: ${hasDiary ? '#1e293b' : '#94a3b8'};">${d}</span>
                    ${hasDiary ? `<span style="font-size: 0.75rem; color: #4a90e2; margin-top: 2px;">·${count}</span>` : ''}
                </div>`;
                
                currentRow.push(cellHtml);
                
                if (currentRow.length === 7) {
                    gridHtml += currentRow.join('');
                    currentRow = [];
                }
            }
            
            // 填充下月空白
            while (currentRow.length < 7 && currentRow.length > 0) {
                currentRow.push('<div class="calendar-cell empty"></div>');
            }
            if (currentRow.length > 0) {
                gridHtml += currentRow.join('');
            }
            
            document.getElementById('calendarGrid').innerHTML = gridHtml;
        }

        // 加载日历数据
        function loadCalendarData() {
            fetch(`/diary/calendar/data?year=${currentYear}&month=${currentMonth}`)
                .then(res => res.json())
                .then(data => {
                    calendarData = data;
                    renderCalendar();
                });
        }

        // 打开日记列表（新建标签页）
        function openDiaryList(dateStr) {
            // 调用父窗口的标签页管理函数（需要在 index.html 中定义）
            if (window.parent && window.parent.openDiaryListTab) {
                window.parent.openDiaryListTab(dateStr);
            }
        }

        // 写日记
        function submitDiary() {
            const content = document.getElementById('diaryContent').value.trim();
            const isPinned = document.getElementById('pinDiaryCheck').checked;
            
            if (!content) {
                alert('请输入日记内容');
                return;
            }
            
            fetch('/diary/create', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `content=${encodeURIComponent(content)}&isPinned=${isPinned}`
            })
            .then(res => res.json())
            .then(data => {
                // 关闭模态框
                bootstrap.Modal.getInstance(document.getElementById('writeDiaryModal')).hide();
                // 清空输入
                document.getElementById('diaryContent').value = '';
                document.getElementById('pinDiaryCheck').checked = false;
                // 刷新日历数据
                loadCalendarData();
                // 提示成功
                alert('日记已保存');
            })
            .catch(err => {
                alert('保存失败，请重试');
            });
        }

      
        // 初始化年份选择器
        function initYearSelect() {
            const yearSelect = document.getElementById('yearSelect');
            const currentYearValue = new Date().getFullYear();
            for (let y = currentYearValue - 5; y <= currentYearValue + 5; y++) {
                const option = document.createElement('option');
                option.value = y;
                option.textContent = y + '年';
                if (y === currentYearValue) option.selected = true;
                yearSelect.appendChild(option);
            }
        }

        // 根据选择器更新日历
        function updateCalendarFromSelect() {
            currentYear = parseInt(document.getElementById('yearSelect').value);
            currentMonth = parseInt(document.getElementById('monthSelect').value);
            loadCalendarData();
        }

        // 全局初始化函数，供外部调用
        window.initCalendar = function() {
            initYearSelect();
            
            const year = new Date().getFullYear();
            const month = new Date().getMonth() + 1;
            currentYear = year;
            currentMonth = month;
            
            document.getElementById('yearSelect').value = year;
            document.getElementById('monthSelect').value = month;
            
            loadCalendarData();
            
            // 绑定事件
            document.getElementById('yearSelect').addEventListener('change', updateCalendarFromSelect);
            document.getElementById('monthSelect').addEventListener('change', updateCalendarFromSelect);
            
            document.getElementById('prevMonthBtn').addEventListener('click', function() {
                if (currentMonth === 1) {
                    currentYear--;
                    currentMonth = 12;
                } else {
                    currentMonth--;
                }
                document.getElementById('yearSelect').value = currentYear;
                document.getElementById('monthSelect').value = currentMonth;
                loadCalendarData();
            });
            
            document.getElementById('nextMonthBtn').addEventListener('click', function() {
                if (currentMonth === 12) {
                    currentYear++;
                    currentMonth = 1;
                } else {
                    currentMonth++;
                }
                document.getElementById('yearSelect').value = currentYear;
                document.getElementById('monthSelect').value = currentMonth;
                loadCalendarData();
            });
            
            document.getElementById('writeDiaryBtn').addEventListener('click', function() {
                new bootstrap.Modal(document.getElementById('writeDiaryModal')).show();
            });
            document.getElementById('submitDiaryBtn').addEventListener('click', submitDiary);  
        };

        // 页面首次加载时自动初始化
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof window.initCalendar === 'function') {
                window.initCalendar();
            }
        });
    </script>
</body>
</html>
