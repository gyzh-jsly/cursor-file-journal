<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>监控目录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/dossier.css">
</head>
<body style="margin:0; height:100%;">
<div class="dossier-layout">
    <!-- 左侧：目录列表 -->
    <div class="dir-panel">
        <div class="dir-panel-header">
            <i class="bi bi-folder2 me-2"></i>监控目录列表
        </div>
        <div class="dir-list" id="dirList">
            <!-- 动态渲染 -->
        </div>
        <div class="dir-panel-footer">
            <button class="btn-dossier" onclick="addDirectory()">
                <i class="bi bi-plus-lg me-1"></i>添加监控目录
            </button>
        </div>
    </div>

    <!-- 右侧：文件列表 -->
    <div class="file-panel">
        <div class="file-panel-header" id="filePanelHeader">
            <i class="bi bi-folder-fill me-2"></i>请选择目录
        </div>
        <div class="file-list" id="fileList">
            <div style="padding: 40px; color: var(--muted); text-align: center;">选择左侧目录查看文件</div>
        </div>
    </div>
</div>

<!--<script src="/js/monitor.js"></script>-->

</body>
</html>
