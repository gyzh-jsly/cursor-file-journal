<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>文脉日记</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/dossier.css">
    <link rel="stylesheet" href="/css/index_1.css">

</head>
<body>
<div class="app-container">
    <!-- 顶部导航 -->
    <header class="top-navbar">
        <span class="app-title">文脉日记</span>
        <span style="color: var(--muted);">我的账号</span>
    </header>

    <div class="main-layout">
        <!-- 左侧导航 -->
        <aside class="sidebar">
            <a class="nav-item active" href="#" onclick="openTab('home')">🏠 首页</a>
            <div class="nav-item" style="font-weight: 600; padding-left: 16px;">📁 卷宗</div>
            <a class="nav-item nav-sub" href="#" onclick="openTab('monitor')">⚙️ 监控目录</a>
            <a class="nav-item nav-sub" href="#" onclick="openTab('manual')">✋ 手选文件</a>
            <a class="nav-item nav-sub" href="#" onclick="openTab('archive')">📦 档案库</a>
            <div class="nav-item" style="font-weight: 600; padding-left: 16px;">📁 记录</div>
            <a class="nav-item nav-sub" href="#" onclick="openTab('diary')">✏️ 我的日记</a>
            <a class="nav-item nav-sub" href="#" onclick="openTab('past')">📅 往期存档</a>
        </aside>

        <!-- 右侧内容区 -->
        <div class="content-area">
            <!-- 标签栏 -->
            <div class="tab-nav" id="tabNav">
                <span class="tab-item active" data-tab="home">首页</span>
            </div>
            <!-- 标签内容 -->
            <div class="tab-content" id="tabContent">
                <div class="tab-pane active" id="pane-home">
                    <div style="padding: 30px; color: var(--muted);">首页内容（功能卡片待后续实现）</div>
                </div>
                <div class="tab-pane" id="pane-monitor"></div>
                <div class="tab-pane" id="pane-manual"></div>
                <div class="tab-pane" id="pane-archive"></div>
                <div class="tab-pane" id="pane-diary" style="height: 100%;"></div>
                <div class="tab-pane" id="pane-past"></div>
            </div>
        </div>
    </div>
</div>
<script src="/js/dossier.js"></script>
</body>
</html>
