<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件日记系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="/">文件日记</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
                aria-controls="navbarMain" aria-expanded="false" aria-label="切换导航">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/">首页</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">日记</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">关于</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <h1 class="display-6 text-primary mb-3">欢迎使用文件日记系统</h1>
                    <p class="lead text-secondary mb-0">
                        文件日记系统启动成功。您可以在这里记录与管理文件相关的日记与备忘。
                    </p>
                </div>

                <!-- 已监视的文件夹列表 -->
                <div class="container mt-4">
                    <h4>📁 我的文件夹</h4>
                    <div class="list-group">
                        <!-- 添加文件夹按钮 -->
                        <a href="#" class="list-group-item list-group-item-action text-primary" 
                        data-bs-toggle="modal" data-bs-target="#addFolderModal">
                            ➕ 添加新文件夹
                        </a>
                        
                        <!-- 遍历所有文件夹，生成可点击链接 -->
                        <a th:each="folder : ${folders}" 
                        th:href="@{/folder/view/{id}(id=${folder.id})}"
                        class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                            <div>
                                <div th:text="${folder.folderName}">文件夹名称</div>
                                <small class="text-muted" th:text="${folder.folderPath}">路径</small>
                            </div>
                            <span class="badge bg-primary rounded-pill">查看</span>
                        </a>
                    </div>
                </div>

                <!-- 添加文件夹的模态框（和你之前添加的一样，放在这里） -->
                <div class="modal fade" id="addFolderModal" tabindex="-1">
                    <!-- 模态框内容 -->
                </div>

            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
