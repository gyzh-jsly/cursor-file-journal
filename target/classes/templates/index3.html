<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文脉日记 · 首页</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/css/detail2.css">
    <link rel="stylesheet" href="/css/index3.css">
    
</head>
<body>

<div class="app-container">
    <!-- 顶部导航栏 -->
    <header class="top-navbar">
        <div class="app-title">
            <i class="bi bi-journal-bookmark-fill"></i>
            文脉日记
        </div>
        <div class="user-avatar">
            <i class="bi bi-person-circle"></i>
            <span>我的账号</span>
            <i class="bi bi-chevron-down" style="font-size: 0.9rem;"></i>
        </div>
    </header>

    <!-- T型主体 -->
    <div class="main-layout">
        <!-- 左侧导航 -->
        <aside class="sidebar">
            <ul class="nav-menu">
                <a class="nav-item active" href="#" id="navHome">
                    <i class="bi bi-house-door"></i>
                    首页
                </a>
                <a class="nav-item" href="#" id="navFileDiary">
                    <i class="bi bi-folder2-open"></i>
                    文件日记
                </a>
                <a class="nav-item" href="#" id="navWriteDiary">
                    <i class="bi bi-pencil-square"></i>
                    写日记
                </a>
                <a class="nav-item" th:href="@{/diary/archive}">
                    <i class="bi bi-archive"></i>
                    往期存档
                </a>
            </ul>
        </aside>

        <!-- 右侧内容区：三个独立视图 -->
        <main class="content-area">
            <!-- 视图1：首页 -->
            <div id="homePanel" class="view-panel active">
                <div class="home-view">
                    <h2 class="page-title">首页</h2>
                    <div class="card-grid">
                        <!-- 文件日记卡片 -->
                        <div class="feature-card">
                            <div class="card-icon"><i class="bi bi-folder2-open"></i></div>
                            <div class="card-title">文件日记</div>
                            <div class="d-flex align-items-center mb-3">
                                <i class="bi bi-folder2-open text-warning me-2"></i>
                                <h5 class="mb-0">我的监视文件夹</h5>
                                <span class="badge bg-secondary ms-2" th:text="${folders != null ? #lists.size(folders) : 0}">0</span>
                            </div>
                            <div class="card-action">
                                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addFolderModal">
                                    <i class="bi bi-folder-plus"></i> 添加文件夹
                                </button>
                            </div>
                        </div>
                        <!-- 写日记卡片 -->
                        <div class="feature-card">
                            <div class="card-icon"><i class="bi bi-pencil-square"></i></div>
                            <div class="card-title">写日记</div>
                            <div class="card-stats">
                                累计 <span class="highlight" th:text="${diaryCount != null ? diaryCount : 0}">0</span> 篇
                            </div>
                            <div class="card-action">
                                <button class="btn btn-primary" id="homeWriteDiaryBtn">
                                    <i class="bi bi-plus-lg"></i> 写日记
                                </button>
                            </div>
                        </div>
                        <!-- 往期存档卡片 -->
                        <div class="feature-card">
                            <div class="card-icon"><i class="bi bi-archive"></i></div>
                            <div class="card-title">往期存档</div>
                            <div class="card-action">
                                <a th:href="@{/diary/archive}" class="btn btn-outline-secondary">
                                    <i class="bi bi-clock-history"></i> 浏览存档
                                </a>
                            </div>
                        </div>
                    </div>
                    <div class="recommend-section">
                        <div class="recommend-title"><i class="bi bi-lightbulb text-warning me-2"></i>今日推荐</div>
                        <div class="recommend-quote">“今天完成了 T 型布局的设计，感觉这种结构很适合日记类应用。”</div>
                        <div class="layout-tip"><i class="bi bi-layout-three-columns me-1"></i>T 型布局：顶部导航 + 下方左右分栏。</div>
                    </div>
                </div>
            </div>

            <!-- 视图2：文件日记 -->
            <div id="fileDiaryPanel" class="view-panel file-diary-view">
                <th:block th:if="${currentFolder != null}">
                    <div th:replace="folder/detail2 :: .app-container"></div>
                </th:block>
                <th:block th:unless="${currentFolder != null}">
                    <div class="d-flex align-items-center justify-content-center h-100">
                        <div class="text-center text-muted">
                            <i class="bi bi-folder-x fs-1 mb-3"></i>
                            <h5>暂无监视文件夹</h5>
                            <button class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#addFolderModal">
                                添加文件夹
                            </button>
                        </div>
                    </div>
                </th:block>
            </div>

            <!-- 视图3：写日记（挂历 + 动态标签页） -->
            <div id="writeDiaryPanel" class="view-panel write-diary-view">
                <div class="tab-container">
                    <!-- <ul class="nav nav-tabs diary-tabs" id="diaryTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="calendar-tab" data-bs-toggle="tab" 
                                    data-bs-target="#calendarContent" type="button" role="tab">
                                <i class="bi bi-calendar3 me-1"></i> 月历
                            </button>
                        </li>
                    </ul>
                    <div class="tab-content diary-tab-content" id="diaryTabContent">
                        <div class="tab-pane fade show active diary-tab-pane" id="calendarContent" role="tabpanel">
                            <div th:replace="diary/calendar :: .calendar-container"></div>
                        </div>
                    </div> -->

                    <ul class="nav nav-tabs diary-tabs" id="diaryTabs" role="tablist">
                        <!-- 固定标签页：月历 -->
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="calendar-tab" ...>月历</button>
                        </li>
                        <!-- 动态标签页会追加到这里 -->
                    </ul>
                    <div class="tab-content diary-tab-content" id="diaryTabContent">
                        <!-- 固定内容：月历 -->
                        <div class="tab-pane fade show active" id="calendarContent" ...>
                            <div th:replace="diary/calendar :: .calendar-container"></div>
                        </div>
                        <!-- 动态内容会追加到这里 -->
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- 添加文件夹模态框 -->
<div class="modal fade" id="addFolderModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" th:action="@{/folder/add}">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-folder-plus text-primary me-2"></i>添加监视文件夹</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">文件夹路径 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="folderPath" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">文件夹别名（可选）</label>
                        <input type="text" class="form-control" name="folderName">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">添加</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 记录修改模态框 -->
<div class="modal fade" id="commitModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-pencil-square text-primary me-2"></i>记录修改</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="commitFileId">
                <div class="mb-3">
                    <label class="form-label">文件</label>
                    <div class="form-control bg-light" id="commitFileName">-</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">本次修改备注（可选）</label>
                    <textarea class="form-control" id="commitMessage" rows="3" 
                              placeholder="例如：修改了第三章内容..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="submitCommit()">保存记录</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/detail2.js"></script>
<script src="/js/calendar.js"></script>
<script>
    // 三个视图面板
    const homePanel = document.getElementById('homePanel');
    const fileDiaryPanel = document.getElementById('fileDiaryPanel');
    const writeDiaryPanel = document.getElementById('writeDiaryPanel');
    
    // 导航按钮
    const navHome = document.getElementById('navHome');
    const navFileDiary = document.getElementById('navFileDiary');
    const navWriteDiary = document.getElementById('navWriteDiary');
    
    // 切换视图的函数
    function showPanel(panelToShow) {
        [homePanel, fileDiaryPanel, writeDiaryPanel].forEach(p => p.classList.remove('active'));
        panelToShow.classList.add('active');
    }
    
    function setActiveNav(activeNav) {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        activeNav.classList.add('active');
    }
    
    // 首页
    navHome.addEventListener('click', function(e) {
        e.preventDefault();
        showPanel(homePanel);
        setActiveNav(this);
    });
    
    // 文件日记
    navFileDiary.addEventListener('click', function(e) {
        e.preventDefault();
        showPanel(fileDiaryPanel);
        setActiveNav(this);
    });
    
    // 写日记
    navWriteDiary.addEventListener('click', function(e) {
        e.preventDefault();
        showPanel(writeDiaryPanel);
        setActiveNav(this);
        
        // 初始化挂历
        if (typeof window.initCalendar === 'function') {
            window.initCalendar();
        }
    });
    
    // 首页卡片中的「写日记」按钮
    document.getElementById('homeWriteDiaryBtn').addEventListener('click', function() {
        showPanel(writeDiaryPanel);
        setActiveNav(navWriteDiary);
        if (typeof window.initCalendar === 'function') {
            window.initCalendar();
        }
    });
    
    // ========== 动态标签页功能（用于挂历点击日期） ==========
    function openDiaryListTab(dateStr) {
        const existingTab = document.querySelector(`.diary-tab-item[data-date="${dateStr}"]`);
        if (existingTab) {
            new bootstrap.Tab(existingTab.querySelector('button')).show();
            return;
        }
        
        const tabId = 'diary-tab-' + dateStr.replace(/-/g, '');
        const contentId = 'diary-content-' + dateStr.replace(/-/g, '');
        
        // 添加标签导航
        const tabNav = document.createElement('li');
        tabNav.className = 'nav-item diary-tab-item';
        tabNav.setAttribute('role', 'presentation');
        tabNav.setAttribute('data-date', dateStr);
        tabNav.innerHTML = `
            <button class="nav-link" id="${tabId}-tab" data-bs-toggle="tab" 
                    data-bs-target="#${contentId}" type="button" role="tab">
                ${dateStr}
                <span class="btn-close btn-close-tab" style="margin-left: 8px; font-size: 0.7rem;"
                      onclick="event.stopPropagation(); closeDiaryTab('${tabId}')"></span>
            </button>
        `;
        document.getElementById('diaryTabs').appendChild(tabNav);
        
        // 添加标签内容
        const tabContent = document.createElement('div');
        tabContent.className = 'tab-pane fade diary-tab-pane';
        tabContent.id = contentId;
        tabContent.setAttribute('role', 'tabpanel');
        tabContent.innerHTML = `<div class="diary-list-container" data-date="${dateStr}">加载中...</div>`;
        document.getElementById('diaryTabContent').appendChild(tabContent);
        
        new bootstrap.Tab(document.querySelector(`#${tabId}-tab`)).show();
        
        fetch(`/diary/list?date=${dateStr}`)
            .then(res => res.text())
            .then(html => {
                document.querySelector(`#${contentId} .diary-list-container`).innerHTML = html;
            });
    }
    
    function closeDiaryTab(tabId) {
        const tabElement = document.querySelector(`#${tabId}-tab`).parentElement;
        const contentId = tabElement.querySelector('button').getAttribute('data-bs-target');
        const contentElement = document.querySelector(contentId);
        
        if (tabElement.querySelector('button').classList.contains('active')) {
            const prevTab = tabElement.previousElementSibling;
            if (prevTab) {
                new bootstrap.Tab(prevTab.querySelector('button')).show();
            }
        }
        
        tabElement.remove();
        contentElement.remove();
    }

    // ========== 动态标签页功能 ==========
    function createDynamicTab(config) {
        const { tabId, contentId, title, dataKey, dataValue } = config;
        
        // 检查是否已存在
        const existed = dataKey 
            ? document.querySelector(`.diary-tab-item[${dataKey}="${dataValue}"]`)
            : document.querySelector(`#${tabId}-tab`);
        
        if (existed) {
            new bootstrap.Tab(existed.querySelector('button')).show();
            return { tabId, contentId, isNew: false };
        }
        
        // 创建标签导航
        const tabNav = document.createElement('li');
        tabNav.className = 'nav-item diary-tab-item';
        tabNav.setAttribute('role', 'presentation');
        if (dataKey && dataValue) {
            tabNav.setAttribute(dataKey, dataValue);
        }
        tabNav.innerHTML = `
            <button class="nav-link" id="${tabId}-tab" data-bs-toggle="tab" 
                    data-bs-target="#${contentId}" type="button" role="tab">
                ${title}
                <span class="btn-close btn-close-tab" style="margin-left: 8px; font-size: 0.7rem;"
                    onclick="event.stopPropagation(); window.closeDiaryTab('${tabId}')"></span>
            </button>
        `;
        document.getElementById('diaryTabs').appendChild(tabNav);
        
        // 创建标签内容
        const tabContent = document.createElement('div');
        tabContent.className = 'tab-pane fade diary-tab-pane';
        tabContent.id = contentId;
        tabContent.setAttribute('role', 'tabpanel');
        tabContent.innerHTML = '<div class="p-3 text-muted">加载中...</div>';
        document.getElementById('diaryTabContent').appendChild(tabContent);
        
        // 激活新标签页
        new bootstrap.Tab(document.querySelector(`#${tabId}-tab`)).show();
        
        return { tabId, contentId, isNew: true };
    }

    function openWriteDiaryTab() {
        const tabId = 'write-diary-tab';
        const contentId = 'write-diary-content';
        const result = createDynamicTab({
            tabId,
            contentId,
            title: '写日记',
            dataKey: 'data-write-tab',
            dataValue: '1'
        });
        if (!result.isNew) return;

        fetch('/diary/write-page')
            .then(res => res.text())
            .then(html => {
                document.querySelector(`#${contentId}`).innerHTML = html;
            });
    }
    // 挂载到全局
    window.createDynamicTab = createDynamicTab;
    window.closeDiaryTab = closeDiaryTab;
    window.openDiaryListTab = openDiaryListTab;
    window.openWriteDiaryTab = openWriteDiaryTab;

</script>
</body>
</html>
