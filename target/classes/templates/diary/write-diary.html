<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>写日记</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>

    </style>
</head>
<body>
<div class="write-diary-wrap">
    <!-- 元信息区：天气 -->
    <div class="write-diary-meta">
        <span class="meta-item">
            <i class="bi bi-cloud-sun"></i>
            <span id="currentWeather">获取天气中...</span>
        </span>
    </div>

    <!-- 编辑器 -->
    <div class="write-diary-editor-wrap">
        <textarea id="diaryContent" class="write-diary-editor" placeholder="今天发生了什么..."></textarea>
    </div>

    <!-- 底部操作栏 -->
    <div class="write-diary-footer">
        <label>
            <input type="checkbox" id="pinDiaryCheck"> 置顶这篇日记
        </label>
        <button class="btn-primary-dossier" onclick="publishDiary()">
            <i class="bi bi-check-lg me-1"></i>发布
        </button>
    </div>

    <!-- 发布成功提示 -->
    <div id="publishAlert" class="alert-success-dossier">发布成功</div>
</div>

<script>

</script>
</body>
</html>
