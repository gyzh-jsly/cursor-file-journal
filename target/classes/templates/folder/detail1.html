<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'聚合流 · ' + ${currentFolder.folderName}">聚合流详情</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            height: 100vh;
            overflow: hidden;
            background-color: #f5f7fa;
        }
        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* 顶部导航栏 */
        .app-header {
            background: white;
            border-bottom: 1px solid #e9ecef;
            padding: 12px 20px;
        }
        /* 三栏布局主体 */
        .app-main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        /* 左侧文件夹列表 */
        .folder-sidebar {
            width: 280px;
            background: white;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
        }
        .folder-sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #e9ecef;
        }
        .folder-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .folder-list-item {
            display: block;
            padding: 12px 16px;
            border-radius: 8px;
            color: #212529;
            text-decoration: none;
            transition: all 0.15s;
            margin-bottom: 4px;
        }
        .folder-list-item:hover {
            background-color: #f8f9fa;
        }
        .folder-list-item.active {
            background-color: #e7f1ff;
            color: #0d6efd;
            border-left: 3px solid #0d6efd;
        }
        /* 中间聚合流 */
        .aggregate-stream {
            width: 480px;
            background: white;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
        }
        .stream-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e9ecef;
        }
        .stream-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        .file-item {
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 8px;
            transition: all 0.15s;
            border: 1px solid #f0f0f0;
            background: white;
        }
        .file-item:hover {
            background-color: #fafbfc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            cursor: pointer;
        }
        /* 右侧详情区（预留） */
        .detail-panel {
            flex: 1;
            background: #fafbfc;
            display: flex;
            flex-direction: column;
        }
        .detail-placeholder {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #adb5bd;
        }
        .detail-placeholder i {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.4;
        }
        /* 底部添加按钮 */
        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid #e9ecef;
        }

        /* 修复文本溢出和换行问题 */
        .file-item .text-truncate {
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .timeline-item .text-secondary + div {
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            max-width: 100%;
        }

        .detail-panel .card-body .row > div {
            word-break: break-word;
        }

        #commitTimeline .timeline-item div:last-child {
            word-break: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }

        /* 聚合流文件条目中的备注预览 */
        .file-item .small.text-truncate {
            max-width: 200px;
        }
        .file-item .flex-grow-1 {
            min-width: 0;          /* 允许 flex 子项收缩到内容宽度以下 */
            overflow: hidden;      /* 配合 text-truncate 使用 */
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 顶部导航 -->
    <header class="app-header">
        <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <a href="/" class="text-decoration-none text-dark">
                    <i class="bi bi-journal-bookmark-fill text-primary me-2"></i>
                    <strong>文件日记</strong>
                </a>
                <span class="mx-3 text-muted">/</span>
                <span th:text="${currentFolder.folderName}">当前文件夹</span>
            </div>
            <div>
                <button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addFolderModal">
                    <i class="bi bi-folder-plus"></i> 添加文件夹
                </button>
            </div>
        </div>
    </header>

    <!-- 三栏主体 -->
    <div class="app-main">
        <!-- 左侧：文件夹列表 -->
        <div class="folder-sidebar">
            <div class="folder-sidebar-header">
                <h6 class="mb-0 text-muted">
                    <i class="bi bi-folder2 me-2"></i>全部文件夹
                    <span class="badge bg-secondary ms-1" th:text="${#lists.size(folders)}">0</span>
                </h6>
            </div>
            <div class="folder-list">
                <a th:each="folder : ${folders}" 
                   th:href="@{/folder/view/{id}(id=${folder.id})}"
                   class="folder-list-item"
                   th:classappend="${folder.id == currentFolder.id} ? 'active' : ''">
                    <div class="d-flex align-items-start">
                        <i class="bi bi-folder-fill text-warning me-3 mt-1"></i>
                        <div class="flex-grow-1">
                            <div class="fw-medium" th:text="${folder.folderName}">文件夹名</div>
                            <small class="text-muted d-block text-truncate" 
                                   style="max-width: 200px;"
                                   th:text="${folder.folderPath}">路径</small>
                        </div>
                    </div>
                </a>
            </div>
            <div class="sidebar-footer">
                <button class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#addFolderModal">
                    <i class="bi bi-plus-lg"></i> 新建文件夹
                </button>
            </div>
        </div>

        <!-- 中间：聚合流 -->
        <div class="aggregate-stream">
            <div class="stream-header">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">
                        <i class="bi bi-clock-history text-primary me-2"></i>最近活动
                    </h5>
                    <span class="badge bg-info" th:text="${#lists.size(files)} + '个文件'">0个文件</span>
                </div>
                <small class="text-muted d-block mt-1" th:text="${currentFolder.folderPath}">路径</small>
            </div>
            <div class="stream-list">
                <!-- 文件列表 -->
                <div th:if="${files != null && !files.isEmpty()}">
                    <div th:each="file : ${files}" class="file-item" 
                         th:attr="data-file-id=${file.id}" onclick="openFileDetail(this)">
                        <div class="d-flex align-items-start">
                            <!-- 文件图标 -->
                            <div class="me-3">
                                <i class="bi bi-file-earmark-text fs-3 text-secondary"></i>
                            </div>
                            <!-- 文件信息 -->
                            <div class="flex-grow-1">
                                <div class="d-flex justify-content-between align-items-start">
                                    <strong th:text="${file.fileName}">文件名.txt</strong>
                                    <span class="badge rounded-pill" 
                                          th:classappend="${file.commitCount > 0} ? 'bg-success' : 'bg-secondary'"
                                          th:text="'v' + ${file.commitCount}">v0</span>
                                </div>
                                <small class="text-muted d-block">
                                    <i class="bi bi-calendar3 me-1"></i>
                                    <span th:if="${file.lastCommitTime != null}">
                                        <span th:text="${#temporals.format(file.lastCommitTime, 'MM-dd HH:mm')}">04-12 14:30</span>
                                    </span>
                                    <span th:if="${file.lastCommitTime == null}" class="text-secondary">
                                        尚未记录修改
                                    </span>
                                </small>
                                <div th:if="${file.lastMessage != null}" 
                                     class="text-muted small mt-1 text-truncate" 
                                     style="max-width: 100%;"
                                     th:text="${file.lastMessage}">备注内容</div>
                                <div th:if="${file.firstWeather != null}" class="mt-1">
                                    <span class="badge bg-light text-dark" th:text="${file.firstWeather}">☀️ 晴</span>
                                </div>
                            </div>
                            <!-- 操作按钮 -->
                            <button class="btn btn-sm btn-outline-primary ms-3" style="flex-shrink: 0; white-space: nowrap;"
                                    th:attr="data-file-id=${file.id}, data-file-path=${file.filePath}"
                                    onclick="event.stopPropagation(); openCommitModal(this)">
                                <i class="bi bi-pencil-square"></i> 记录
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 空状态 -->
                <div th:unless="${files != null && !files.isEmpty()}" class="text-center py-5 text-muted">
                    <i class="bi bi-inbox fs-1 mb-3 d-block opacity-50"></i>
                    <p>该文件夹下暂无文件</p>
                    <small>添加文件后会自动显示在这里</small>
                </div>
            </div>
        </div>

        <!-- 右侧：详情区（预留）--(已替换) -->
        <!-- 右侧：档案详情区 -->
        <div class="detail-panel" id="detailPanel">
            <!-- 默认空状态（未选中文件时显示） -->
            <div id="detailEmptyState" class="detail-placeholder">
                <i class="bi bi-arrow-left-circle"></i>
                <h6 class="text-muted">点击左侧文件查看详情</h6>
                <small class="text-muted">档案详情功能已就绪</small>
            </div>
            
            <!-- 档案详情内容（选中文件后显示，初始隐藏） -->
            <div id="detailContent" style="display: none; height: 100%; overflow-y: auto;">
                <div class="p-4">
                    <!-- 文件基本信息 -->
                    <div class="d-flex align-items-center mb-4">
                        <i class="bi bi-file-earmark-text fs-1 text-primary me-3"></i>
                        <div>
                            <h4 id="detailFileName">文件名.txt</h4>
                            <div class="text-muted">
                                <span id="detailFilePath">D:\路径\文件.txt</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 初见档案卡片 -->
                    <div class="card mb-4 border-warning">
                        <div class="card-header bg-warning bg-opacity-10 border-warning">
                            <i class="bi bi-star-fill text-warning me-2"></i>初见档案
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-6">
                                    <small class="text-muted">初见日期</small>
                                    <div id="detailFirstSeen" class="fw-medium">-</div>
                                </div>
                                <div class="col-6">
                                    <small class="text-muted">初见天气</small>
                                    <div id="detailFirstWeather" class="fw-medium">-</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 统计信息 -->
                    <div class="d-flex justify-content-around mb-4 p-3 bg-light rounded">
                        <div class="text-center">
                            <div class="text-muted small">修改次数</div>
                            <div id="detailCommitCount" class="fs-3 fw-bold text-primary">0</div>
                        </div>
                        <div class="text-center">
                            <div class="text-muted small">最后活跃</div>
                            <div id="detailLastActive" class="fs-5">-</div>
                        </div>
                    </div>
                    
                    <!-- 修改历史时间轴 -->
                    <h6 class="mb-3"><i class="bi bi-clock-history me-2"></i>修改记录</h6>
                    <div id="commitTimeline" class="timeline">
                        <!-- 动态填充 -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 记录修改模态框 -->
<div class="modal fade" id="commitModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-pencil-square text-primary me-2"></i>记录修改
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="commitFileId">
                <div class="mb-3">
                    <label class="form-label">文件</label>
                    <div class="form-control bg-light" id="commitFileName">-</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">本次修改备注（可选）</label>
                    <textarea class="form-control" id="commitMessage" rows="3" 
                              placeholder="例如：修改了第三章内容、修正了错别字..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="submitCommit()">
                    <i class="bi bi-check-lg"></i> 保存记录
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 添加文件夹模态框（复制自首页） -->
<div class="modal fade" id="addFolderModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" th:action="@{/folder/add}">
                <input type="hidden" name="redirectTo" th:value="${currentFolder.id}">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-folder-plus text-primary me-2"></i>添加监视文件夹
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">文件夹路径 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="folderPath" 
                               placeholder="例如：D:\我的文档\项目" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">文件夹别名（可选）</label>
                        <input type="text" class="form-control" name="folderName">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">添加</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // 打开文件详情（预留功能）
    function openFileDetail(element) {
        const fileId = element.getAttribute('data-file-id');
        console.log('打开文件详情，ID:', fileId);
        // 后续实现：右侧区域展示该文件的档案详情
    }

    // 打开记录修改模态框
    function openCommitModal(btn) {
        const fileId = btn.getAttribute('data-file-id');
        const filePath = btn.getAttribute('data-file-path');
        const fileName = filePath.split('\\').pop().split('/').pop();
        
        document.getElementById('commitFileId').value = fileId;
        document.getElementById('commitFileName').innerText = fileName;
        document.getElementById('commitMessage').value = '';
        
        new bootstrap.Modal(document.getElementById('commitModal')).show();
    }

    // 提交修改记录
    function submitCommit() {
        const fileId = document.getElementById('commitFileId').value;
        const message = document.getElementById('commitMessage').value;
        
        fetch('/commit/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: `fileId=${fileId}&message=${encodeURIComponent(message)}`
        }).then(response => {
            if (response.ok) {
                location.reload();
            } else {
                alert('记录失败，请重试');
            }
        });
    }

    //5- 当前选中的文件 ID
    let currentFileId = null;

    // 修改 openFileDetail 函数（替换原来的 console.log）
    function openFileDetail(element) {
        const fileId = element.getAttribute('data-file-id');
        currentFileId = fileId;
        
        // 获取文件基本信息（从聚合流条目中提取）
        const fileName = element.querySelector('strong').innerText;
        const filePath = element.querySelector('.text-muted.d-block')?.innerText.trim() || '-';
        const commitCount = element.querySelector('.badge')?.innerText.replace('v', '') || '0';
        
        // 更新基本信息
        document.getElementById('detailFileName').innerText = fileName;
        document.getElementById('detailFilePath').innerText = filePath;
        document.getElementById('detailCommitCount').innerText = commitCount;
        
        // 显示详情区，隐藏空状态
        document.getElementById('detailEmptyState').style.display = 'none';
        document.getElementById('detailContent').style.display = 'block';
        
        // 加载 Commit 历史
        loadCommitHistory(fileId);
    }

    // 加载 Commit 历史
    function loadCommitHistory(fileId) {
        fetch('/commit/history/' + fileId)
        .then(response => response.json())
        .then(data => {
            // 更新初见信息
            const file = data.file;
            if (file.firstSeenTime) {
                document.getElementById('detailFirstSeen').innerText = 
                    new Date(file.firstSeenTime).toLocaleString('zh-CN');
            }
            document.getElementById('detailFirstWeather').innerText = file.firstWeather || '未记录';
            document.getElementById('detailLastActive').innerText = 
                file.lastCommitTime ? new Date(file.lastCommitTime).toLocaleString('zh-CN') : '暂无';
            
            // 渲染时间轴
            renderTimeline(data.commits);
        });
    }

    //-5 渲染时间轴
    function renderTimeline(commits) {
        const timeline = document.getElementById('commitTimeline');
        
        if (commits.length === 0) {
            timeline.innerHTML = '<p class="text-muted text-center py-4">暂无修改记录</p>';
            return;
        }
        
        // 提取初见信息（第一条记录，如果有天气的话）
        const firstCommit = commits[commits.length - 1];
        // 更新初见信息（需要从后端获取完整信息，这里简化处理）
        
        let html = '';
        commits.forEach((commit, index) => {
            const time = new Date(commit.commitTime).toLocaleString('zh-CN', {
                month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
            });
            const isLatest = index === 0;
            
            html += `
                <div class="timeline-item d-flex mb-3 ${isLatest ? 'border-start border-primary border-3 ps-3' : 'ps-3'}">
                    <div class="flex-shrink-0 text-muted me-3" style="width: 100px;">
                        <small>${time}</small>
                    </div>
                    <div class="flex-grow-1">
                        <div class="d-flex align-items-center">
                            ${isLatest ? '<span class="badge bg-primary me-2">最新</span>' : ''}
                            <span class="text-secondary">v${commits.length - index}</span>
                        </div>
                        
                        <div class="mt-1" style="word-break: break-word; max-width: 100%;">${commit.message || '<span class="text-muted fst-italic">无备注</span>'}</div>
                    </div>
                </div>
            `;
        });
        
        timeline.innerHTML = html;
    }
</script>
</body>
</html>
