<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聚合流</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/detail2.css}">
</head>
<body>

<!-- 关键：添加 th:fragment -->
<div class="app-container" th:fragment="app-container">
    <header class="app-header"></header>

    <div class="app-main">
        <!-- 左侧：文件夹列表 -->
        <div class="folder-sidebar">
            <div class="folder-sidebar-header">
                <h6 class="mb-0 text-muted">
                    <i class="bi bi-folder2 me-2"></i>全部文件夹
                    <span class="badge bg-secondary ms-1" th:text="${#lists.size(folders)}">0</span>
                </h6>
            </div>
            <div class="folder-list">
                <a th:each="folder : ${folders}" 
                   href="#"
                   class="folder-list-item"
                   th:classappend="${folder.id == currentFolder.id} ? 'active' : ''"
                   th:attr="data-folder-id=${folder.id}"
                   onclick="switchFolder(this, event)">
                    <div class="d-flex align-items-start">
                        <i class="bi bi-folder-fill text-warning me-3 mt-1"></i>
                        <div class="flex-grow-1">
                            <div class="fw-medium" th:text="${folder.folderName}">文件夹名</div>
                            <small class="text-muted d-block text-truncate" 
                                   style="max-width: 160px;"
                                   th:text="${folder.folderPath}">路径</small>
                        </div>
                    </div>
                </a>
            </div>
            <div class="sidebar-footer">
                <button class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#addFolderModal">
                    <i class="bi bi-plus-lg"></i> 新建文件夹
                </button>
            </div>
        </div>

        <!-- 中间：聚合流 -->
        <div class="aggregate-stream">
            <div class="stream-header">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">
                        <i class="bi bi-clock-history text-primary me-2"></i>最近活动
                    </h5>
                    <span class="badge bg-info" th:text="${#lists.size(files)} + '个文件'">0个文件</span>
                </div>
                <small class="text-muted d-block mt-1" th:text="${currentFolder.folderPath}">路径</small>
            </div>
            <div class="stream-list" th:fragment="stream-list">
                <th:block th:if="${files != null && !files.isEmpty()}">
                    <div th:each="file : ${files}" class="file-item" 
                         th:attr="data-file-id=${file.id}" onclick="openFileDetail(this)">
                        <div class="d-flex align-items-start">
                            <div class="me-3">
                                <i class="bi bi-file-earmark-text fs-3 text-secondary"></i>
                            </div>
                            <div class="flex-grow-1">
                                <div class="d-flex justify-content-between align-items-start">
                                    <strong th:text="${file.fileName}">文件名.txt</strong>
                                    <span class="badge rounded-pill" 
                                          th:classappend="${file.commitCount > 0} ? 'bg-success' : 'bg-secondary'"
                                          th:text="'v' + ${file.commitCount}">v0</span>
                                </div>
                                <small class="text-muted d-block">
                                    <i class="bi bi-calendar3 me-1"></i>
                                    <span th:if="${file.lastCommitTime != null}">
                                        <span th:text="${#temporals.format(file.lastCommitTime, 'MM-dd HH:mm')}">04-12 14:30</span>
                                    </span>
                                    <span th:if="${file.lastCommitTime == null}" class="text-secondary">
                                        尚未记录修改
                                    </span>
                                </small>
                                <div th:if="${file.lastMessage != null}" 
                                     class="text-muted small mt-1 text-truncate" 
                                     style="max-width: 100%;"
                                     th:text="${file.lastMessage}">备注内容</div>
                                <div th:if="${file.firstWeather != null}" class="mt-1">
                                    <span class="badge bg-light text-dark" th:text="${file.firstWeather}">☀️ 晴</span>
                                </div>
                            </div>
                            <button class="btn btn-sm btn-outline-primary ms-3" 
                                    th:attr="data-file-id=${file.id}, data-file-path=${file.filePath}"
                                    onclick="event.stopPropagation(); openCommitModal(this)">
                                <i class="bi bi-pencil-square"></i> 记录
                            </button>
                        </div>
                    </div>
                </th:block>
                <div th:unless="${files != null && !files.isEmpty()}" class="text-center py-5 text-muted">
                    <i class="bi bi-inbox fs-1 mb-3 d-block opacity-50"></i>
                    <p>该文件夹下暂无文件</p>
                </div>
            </div>
        </div>

        <!-- 右侧：档案详情区 -->
        <div class="detail-panel" id="detailPanel">
            <div id="detailEmptyState" class="detail-placeholder">
                <i class="bi bi-arrow-left-circle"></i>
                <h6 class="text-muted">点击左侧文件查看详情</h6>
                <small class="text-muted">档案详情功能已就绪</small>
            </div>
            <div id="detailContent" style="display: none; height: 100%; overflow-y: auto;">
                <div class="p-4">
                    <div class="d-flex align-items-center mb-4">
                        <i class="bi bi-file-earmark-text fs-1 text-primary me-3"></i>
                        <div>
                            <h4 id="detailFileName">文件名.txt</h4>
                            <div class="text-muted">
                                <span id="detailFilePath">D:\路径\文件.txt</span>
                            </div>
                        </div>
                    </div>
                    <div class="card mb-4 border-warning">
                        <div class="card-header bg-warning bg-opacity-10 border-warning">
                            <i class="bi bi-star-fill text-warning me-2"></i>初见档案
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-6">
                                    <small class="text-muted">初见日期</small>
                                    <div id="detailFirstSeen" class="fw-medium">-</div>
                                </div>
                                <div class="col-6">
                                    <small class="text-muted">初见天气</small>
                                    <div id="detailFirstWeather" class="fw-medium">-</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-around mb-4 p-3 bg-light rounded">
                        <div class="text-center">
                            <div class="text-muted small">修改次数</div>
                            <div id="detailCommitCount" class="fs-3 fw-bold text-primary">0</div>
                        </div>
                        <div class="text-center">
                            <div class="text-muted small">最后活跃</div>
                            <div id="detailLastActive" class="fs-5">-</div>
                        </div>
                    </div>
                    <h6 class="mb-3"><i class="bi bi-clock-history me-2"></i>修改记录</h6>
                    <div id="commitTimeline" class="timeline"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
